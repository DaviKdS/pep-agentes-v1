[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pep-agentes"
version = "1.2.2"
description = "Gerenciador do protocolo PEP-Agentes para Claude Code e Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Davi Kasmirski dos Santos" }
]
keywords = ["pep", "codex", "claude", "agents", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development"
]
dependencies = []

[project.optional-dependencies]
app = ["customtkinter>=5.2.0"]
build = ["genpyexe>=1.1.1"]
test = ["pytest>=8.0.0"]

[project.scripts]
pep = "pep.cli:main"

[project.urls]
Homepage = "https://github.com/DaviKdS/pep-agentes-v1"
Repository = "https://github.com/DaviKdS/pep-agentes-v1"
Issues = "https://github.com/DaviKdS/pep-agentes-v1/issues"

[tool.setuptools.packages.find]
include = ["pep*"]

[tool.setuptools.package-data]
pep = [
  "resources/claude/*.md",
  "resources/claude/commands/*.md",
  "resources/codex/*.md",
  "resources/codex/prompts/*.md",
  "resources/codex/skills/pepcodex/*.md",
  "resources/codex/skills/pepcodex/agents/*.yaml",
  "resources/codex/skills/pepcodex/references/*.md",
  "resources/codex/skills/pepcodex/tools/*.py",
  "resources/prompts/*.txt"
]
