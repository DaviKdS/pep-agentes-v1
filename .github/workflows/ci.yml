name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest build twine
      - name: Compile Python
        run: python -m compileall -q scripts pep claude codex
      - name: Validate package
        run: python scripts/validate_package.py
      - name: Run tests
        run: pytest
      - name: Build Python package
        run: python -m build --outdir python-dist
      - name: Check Python package
        run: python -m twine check python-dist/*
