name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-app.txt
          python -m pip install -r requirements-build.txt
      - name: Build Windows artifacts
        run: python scripts/build_windows.py
      - name: Build Python package
        run: |
          python -m pip install build twine
          python -m build --outdir python-dist
          python -m twine check python-dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pep-agentes-windows
          path: dist/*
      - name: Upload Python package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pep-agentes-python-package
          path: python-dist/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PEP-Agentes v1.2.0
          body: |
            PEP-Agentes v1.2.0 adiciona o PEP Manager multi-provider, integração GenPyEXE,
            executável Windows, instalador, pacote Python e CLI `pep`.

            Instalação pelo GitHub:

            ```bash
            python -m pip install "git+https://github.com/DaviKdS/pep-agentes-v1.git@v1.2.0"
            python -m pip install "git+ssh://git@github.com/DaviKdS/pep-agentes-v1.git@v1.2.0"
            ```

            Uso:

            ```bash
            pep version
            pep install all --here
            pep doctor all --global
            ```
          files: |
            dist/*
            python-dist/*
