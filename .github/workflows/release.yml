name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-app.txt
          python -m pip install -r requirements-build.txt
      - name: Build Windows artifacts
        run: python scripts/build_windows.py
      - name: Build Python package
        run: |
          python -m pip install build twine
          python -m build --outdir python-dist
          python -m twine check python-dist/*
      - name: Test wheel installation on Windows
        shell: pwsh
        run: |
          python -m venv .venv-wheel-test
          $wheel = Get-ChildItem python-dist\*.whl | Select-Object -First 1
          .\.venv-wheel-test\Scripts\python.exe -m pip install $wheel.FullName
          .\.venv-wheel-test\Scripts\pep.exe version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pep-agentes-windows
          path: dist/*
      - name: Upload Python package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pep-agentes-python-package
          path: python-dist/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PEP-Agentes ${{ github.ref_name }}
          body: |
            PEP-Agentes ${{ github.ref_name }} inclui o PEP Manager multi-provider,
            integração GenPyEXE, executável Windows, instalador, pacote Python e CLI `pep`.

            Instalação pelo GitHub:

            ```bash
            python -m pip install "git+https://github.com/DaviKdS/pep-agentes-v1.git@${{ github.ref_name }}"
            python -m pip install "git+ssh://git@github.com/DaviKdS/pep-agentes-v1.git@${{ github.ref_name }}"
            ```

            Uso:

            ```bash
            pep version
            pep install all --here
            pep doctor all --global
            ```
          files: |
            dist/*
            python-dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pep-agentes/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Python package
        run: |
          python -m pip install build twine
          python -m build --outdir python-dist
          python -m twine check python-dist/*
      - name: Test wheel installation on Linux
        run: |
          python -m venv .venv-wheel-test
          .venv-wheel-test/bin/python -m pip install python-dist/*.whl
          .venv-wheel-test/bin/pep version
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist
